<svg xmlns="http://www.w3.org/2000/svg" width="213" height="177" viewBox="0 0 213 177">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff0" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#f60" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#f00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- exhaust -->
  <ellipse cx="38" cy="140" rx="34" ry="18" fill="url(#glow)" transform="rotate(-35 38 140)"/>
  <!-- the pencil-ship, flying up and right -->
  <g transform="rotate(-35 106 96)">
    <rect x="40" y="82" width="22" height="28" fill="#c9c9c9" stroke="#000"/>
    <rect x="40" y="86" width="22" height="3" fill="#888"/>
    <rect x="40" y="103" width="22" height="3" fill="#888"/>
    <rect x="28" y="82" width="14" height="28" rx="5" fill="#f69" stroke="#000"/>
    <rect x="62" y="82" width="96" height="28" fill="#fc0" stroke="#000"/>
    <rect x="62" y="91" width="96" height="10" fill="#e6a800"/>
    <polygon points="158,82 196,96 158,110" fill="#f3d9a4" stroke="#000"/>
    <polygon points="184,91.5 196,96 184,100.5" fill="#333"/>
    <!-- porthole with pilot -->
    <circle cx="112" cy="96" r="11" fill="#035" stroke="#000" stroke-width="2"/>
    <ellipse cx="112" cy="98" rx="6" ry="7" fill="#3f3"/>
    <ellipse cx="109.5" cy="96" rx="2.2" ry="3" fill="#000"/>
    <ellipse cx="114.5" cy="96" rx="2.2" ry="3" fill="#000"/>
    <!-- fins -->
    <polygon points="70,82 58,62 86,82" fill="#c0f" stroke="#000"/>
    <polygon points="70,110 58,130 86,110" fill="#c0f" stroke="#000"/>
  </g>
  <!-- calligraphy trail -->
  <path d="M8 170 C40 120 60 175 90 150 S130 120 118 160" fill="none" stroke="#0f0" stroke-width="3" stroke-linecap="round"/>
  <circle cx="190" cy="20" r="2" fill="#fff"/>
  <circle cx="160" cy="160" r="1.5" fill="#fff"/>
  <circle cx="20" cy="30" r="1.5" fill="#fff"/>
</svg>
